<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a237e; }
      .header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .cell-text { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #424242; }
      .row-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #263238; }
      .grid-line { stroke: #cfd8dc; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="480" fill="#ffffff"/>

  <text x="500" y="30" class="title" text-anchor="middle">Pipeline Latency and Initiation Interval (II = 1) Timing Diagram</text>

  <!-- Cycle Headers -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="50" y="20" class="header">Cycle T0</text>

    <rect x="110" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="160" y="20" class="header">Cycle T1</text>

    <rect x="220" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="270" y="20" class="header">Cycle T2</text>

    <rect x="330" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="380" y="20" class="header">Cycle T3</text>

    <rect x="440" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="490" y="20" class="header">Cycle T4</text>

    <rect x="550" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="600" y="20" class="header">Cycle T5</text>

    <rect x="660" y="0" width="100" height="30" fill="#1565c0" rx="3"/>
    <text x="710" y="20" class="header">Cycle T6</text>
  </g>

  <!-- Row 1: Input Stream -->
  <text x="30" y="130" class="row-header">Inputs Accepted</text>
  <text x="30" y="145" class="desc-text">(in_valid = 1)</text>
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="100" height="35" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
    <text x="50" y="22" class="cell-text" fill="#0d47a1">Op 0 (A0, B0)</text>

    <rect x="110" y="0" width="100" height="35" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
    <text x="160" y="22" class="cell-text" fill="#0d47a1">Op 1 (A1, B1)</text>

    <rect x="220" y="0" width="100" height="35" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
    <text x="270" y="22" class="cell-text" fill="#0d47a1">Op 2 (A2, B2)</text>

    <rect x="330" y="0" width="100" height="35" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
    <text x="380" y="22" class="cell-text" fill="#0d47a1">Op 3 (A3, B3)</text>

    <rect x="440" y="0" width="100" height="35" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
    <text x="490" y="22" class="cell-text" fill="#0d47a1">Op 4 (A4, B4)</text>

    <rect x="550" y="0" width="100" height="35" fill="#ffebee" stroke="#e53935" stroke-width="1.5" rx="4"/>
    <text x="600" y="22" class="cell-text" fill="#b71c1c">IDLE / BUBBLE</text>

    <rect x="660" y="0" width="100" height="35" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
    <text x="710" y="22" class="cell-text" fill="#0d47a1">Op 5 (A5, B5)</text>
  </g>

  <!-- Row 2: Stage 1 Multiplier -->
  <text x="30" y="200" class="row-header">Stage 1: Multiplier</text>
  <text x="30" y="215" class="desc-text">(M Register Latched)</text>
  <g transform="translate(200, 180)">
    <rect x="0" y="0" width="100" height="35" fill="#f5f5f5" stroke="#bdbdbd" rx="4"/>
    <text x="50" y="22" class="cell-text" fill="#757575">-</text>

    <rect x="110" y="0" width="100" height="35" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="4"/>
    <text x="160" y="22" class="cell-text" fill="#e65100">Prod 0 (A0*B0)</text>

    <rect x="220" y="0" width="100" height="35" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="4"/>
    <text x="270" y="22" class="cell-text" fill="#e65100">Prod 1 (A1*B1)</text>

    <rect x="330" y="0" width="100" height="35" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="4"/>
    <text x="380" y="22" class="cell-text" fill="#e65100">Prod 2 (A2*B2)</text>

    <rect x="440" y="0" width="100" height="35" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="4"/>
    <text x="490" y="22" class="cell-text" fill="#e65100">Prod 3 (A3*B3)</text>

    <rect x="550" y="0" width="100" height="35" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="4"/>
    <text x="600" y="22" class="cell-text" fill="#e65100">Prod 4 (A4*B4)</text>

    <rect x="660" y="0" width="100" height="35" fill="#ffebee" stroke="#e53935" stroke-width="1.5" rx="4"/>
    <text x="710" y="22" class="cell-text" fill="#b71c1c">ISOLATED / 0</text>
  </g>

  <!-- Row 3: Stage 2 Accumulator -->
  <text x="30" y="270" class="row-header">Stage 2: Accumulator</text>
  <text x="30" y="285" class="desc-text">(P Register Updated)</text>
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="100" height="35" fill="#f5f5f5" stroke="#bdbdbd" rx="4"/>
    <text x="50" y="22" class="cell-text" fill="#757575">-</text>

    <rect x="110" y="0" width="100" height="35" fill="#f5f5f5" stroke="#bdbdbd" rx="4"/>
    <text x="160" y="22" class="cell-text" fill="#757575">-</text>

    <rect x="220" y="0" width="100" height="35" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="4"/>
    <text x="270" y="22" class="cell-text" fill="#1b5e20">ACC = P0</text>

    <rect x="330" y="0" width="100" height="35" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="4"/>
    <text x="380" y="22" class="cell-text" fill="#1b5e20">ACC += P1</text>

    <rect x="440" y="0" width="100" height="35" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="4"/>
    <text x="490" y="22" class="cell-text" fill="#1b5e20">ACC += P2</text>

    <rect x="550" y="0" width="100" height="35" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="4"/>
    <text x="600" y="22" class="cell-text" fill="#1b5e20">ACC += P3</text>

    <rect x="660" y="0" width="100" height="35" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="4"/>
    <text x="710" y="22" class="cell-text" fill="#1b5e20">ACC += P4</text>
  </g>

  <!-- Row 4: out_valid Output -->
  <text x="30" y="340" class="row-header">out_valid Signal</text>
  <text x="30" y="355" class="desc-text">(Handshake valid)</text>
  <g transform="translate(200, 320)">
    <rect x="0" y="0" width="100" height="35" fill="#f5f5f5" stroke="#bdbdbd" rx="4"/>
    <text x="50" y="22" class="cell-text" fill="#757575">0</text>

    <rect x="110" y="0" width="100" height="35" fill="#f5f5f5" stroke="#bdbdbd" rx="4"/>
    <text x="160" y="22" class="cell-text" fill="#757575">0</text>

    <rect x="220" y="0" width="100" height="35" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" rx="4"/>
    <text x="270" y="22" class="cell-text" fill="#311b92">1 (Valid)</text>

    <rect x="330" y="0" width="100" height="35" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" rx="4"/>
    <text x="380" y="22" class="cell-text" fill="#311b92">1 (Valid)</text>

    <rect x="440" y="0" width="100" height="35" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" rx="4"/>
    <text x="490" y="22" class="cell-text" fill="#311b92">1 (Valid)</text>

    <rect x="550" y="0" width="100" height="35" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" rx="4"/>
    <text x="600" y="22" class="cell-text" fill="#311b92">1 (Valid)</text>

    <rect x="660" y="0" width="100" height="35" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" rx="4"/>
    <text x="710" y="22" class="cell-text" fill="#311b92">1 (Valid)</text>
  </g>

  <!-- Explanatory Annotations -->
  <path d="M250,90 L250,55 L470,55 L470,90" fill="none" stroke="#00796b" stroke-width="2"/>
  <text x="360" y="48" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#00796b" text-anchor="middle">Pipeline Latency = 2 Clock Cycles</text>

  <path d="M420,400 L530,400" fill="none" stroke="#d81b60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="420" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="bold" fill="#d81b60" text-anchor="middle">Initiation Interval (II) = 1 Cycle / New Output Every Cycle</text>
</svg>
